<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Colours and fonts: change them here to restyle everything ===== */
:root{--bg:#fff;--ink:#0f1419;--muted:#536471;--line:#eff3f4;--soft:#f7f9f9;--gold:#ffb300;--on-gold:#2a1d00;--accent:#a86e00;--neg:#d4202c;
--font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Page layout: one centred column, side menu on big screens ===== */
.app{display:flex;justify-content:center;min-height:100vh}
.col{width:100%;max-width:600px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.side{display:none}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:52px;padding:env(safe-area-inset-top,0px) 12px 0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:8px;max-width:70%;font-weight:700}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:var(--soft)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.bottom button{padding:8px 26px;color:var(--muted)}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{stroke-width:2.8}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:210px;padding:14px 10px;position:sticky;top:0;height:100vh}
  .side .logo{font:800 30px var(--font);padding:4px 14px 12px}
  .side button{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:99px;font-size:18px;color:var(--ink)}
  .side button:hover{background:var(--soft)}
  .side button[aria-current="page"]{font-weight:800}
  nav.bottom{display:none}.col{padding-bottom:0}}

/* ===== Buttons, avatars, text ===== */
.btn{border-radius:99px;padding:7px 16px;font-weight:700;font-size:14px;background:var(--ink);color:#fff}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid #cfd9de}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;width:40px;height:40px;font-size:16px}
.av.s{width:32px;height:32px;font-size:13px}.av.l{width:72px;height:72px;font-size:28px}.av.m{width:46px;height:46px;font-size:18px}
.sec{font-size:17px;font-weight:800;margin:0;padding:14px 14px 6px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.mention{color:var(--accent);font-weight:600}
.mention:hover{text-decoration:underline}

/* ===== Posts (X style: flat rows, thin lines) ===== */
.compose{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.compose textarea{width:100%;border:0;outline:0;resize:none;min-height:48px;font-size:17px;background:transparent}
.compose .tools{display:flex;justify-content:flex-end;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.post{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.post:hover{background:var(--soft)}
.pbody{flex:1;min-width:0}
.phead{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap}
.pname{font-weight:800}
.pname:hover{text-decoration:underline}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.link{color:var(--muted);font-size:13px;padding:6px 0}
.link:hover{color:var(--neg)}

/* ===== Profile, search, lists ===== */
.pro{padding:14px;border-bottom:1px solid var(--line)}
.pro h2{margin:8px 0 0;font-size:20px;font-weight:800}
.pro .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:hover{background:var(--soft)}
.name{font-weight:700}
.searchbox{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #cfd9de;background:var(--bg);font-size:16px}
.field:focus{border-color:var(--gold);outline:0}
.walletcard{margin:14px;padding:20px;border-radius:16px;background:var(--ink);color:#fff}
.walletcard .bal{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px}

/* ===== Chat room (WhatsApp style) ===== */
.room{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);background:#efeae2}
.roomhead{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.tools{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .btn{white-space:nowrap;padding:5px 12px;font-size:13px}
.roomlist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:84%;padding:6px 10px 4px;border-radius:10px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.1);border-top-left-radius:2px;overflow-wrap:anywhere}
.bubble.mine{margin-left:auto;background:#fff1c7;border-top-left-radius:10px;border-top-right-radius:2px}
.bubble .who{font-weight:700;font-size:13px}
.bubble .txt{white-space:pre-wrap}
.bubble .meta{display:flex;justify-content:flex-end;gap:8px;font-size:11px;color:var(--muted)}
.bubble .meta button{color:var(--muted);font-size:11px;text-decoration:underline}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.composer textarea{flex:1;border:1px solid #cfd9de;border-radius:20px;padding:9px 14px;resize:none;max-height:120px;font-size:16px;outline:0;background:var(--soft)}
.send{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.4}
.bubble.everyone{background:#ffeeb8;border:1px solid var(--gold)}
.everyone-tag{color:var(--accent);font-weight:800}
.member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--bg);border-bottom:1px solid var(--line)}
.seg button{flex:1;padding:9px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.anonnote{padding:6px 12px;font-size:12px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.bubble.anon{background:#f2f2f2}
.termsbox{max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:4px 12px 10px;font-size:14px;margin-top:8px}
.termsbox h3{margin:10px 0 2px;font-size:17px}.termsbox h4{margin:12px 0 2px;font-size:14px}.termsbox p{margin:2px 0}

/* ===== Sign-in screens, popups, messages ===== */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .box{width:100%;max-width:380px}
.auth h1{font-size:30px;font-weight:800;margin:14px 0 14px;letter-spacing:-.02em}
.mark{width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:26px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.pw{position:relative}.pw .field{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.eye svg{width:20px;height:20px}
.hint{color:var(--muted);font-size:13px;margin-top:5px}
.err{color:var(--neg);font-size:14px;min-height:20px;margin-top:8px}
.wide{width:100%;padding:12px;font-size:15px;margin-top:8px}
dialog{border:0;border-radius:16px;padding:18px;width:min(400px,92vw);background:var(--bg);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:19px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="input-dialog">
  <h2 id="input-title"></h2>
  <label for="input-value" id="input-label"></label>
  <textarea id="input-value" rows="2" class="field"></textarea>
  <label id="private-row" style="display:none;font-weight:500"><input type="checkbox" id="input-private" style="margin-right:8px">Make it private (invite-only, joined by link)</label>
  <label id="approval-row" style="display:none;font-weight:500"><input type="checkbox" id="input-approval" checked style="margin-right:8px">Admins approve new members</label>
  <label id="anon-row" style="display:none;font-weight:500"><input type="checkbox" id="input-anon" style="margin-right:8px">Allow anonymous chat in this group</label>
  <div class="err" id="input-error"></div>
  <div class="row" style="justify-content:flex-end;margin-top:6px">
    <button class="btn ghost" data-action="closeInputDialog" type="button">Cancel</button>
    <button class="btn gold" data-action="submitInput" type="button">Save</button>
  </div>
</dialog>

<dialog id="password-dialog">
  <h2>Change password</h2>
  <div id="password-fields"></div>
  <div class="err" id="password-error"></div>
  <div class="row" style="justify-content:flex-end;margin-top:6px">
    <button class="btn ghost" data-action="closePasswordDialog" type="button">Cancel</button>
    <button class="btn gold" data-action="submitPassword" type="button">Save</button>
  </div>
</dialog>

<dialog id="terms-dialog">
  <div class="termsbox" id="terms-body" style="max-height:65vh"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <button class="btn ghost" data-action="closeTerms" type="button">Close</button>
  </div>
</dialog>

<dialog id="panel-dialog">
  <h2 id="panel-title"></h2>
  <div id="panel-body" style="max-height:60vh;overflow-y:auto;margin-top:8px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <button class="btn ghost" data-action="closePanel" type="button">Close</button>
  </div>
</dialog>

<dialog id="mute-dialog">
  <h2>Mute member</h2>
  <div class="hint">They can still read the group, but cannot send messages until this time.</div>
  <div class="row" style="flex-wrap:wrap;margin:10px 0">
    <button class="btn ghost" data-action="mutePreset" data-minutes="10" type="button">10 min</button>
    <button class="btn ghost" data-action="mutePreset" data-minutes="60" type="button">1 hour</button>
    <button class="btn ghost" data-action="mutePreset" data-minutes="1440" type="button">1 day</button>
    <button class="btn ghost" data-action="mutePreset" data-minutes="10080" type="button">1 week</button>
  </div>
  <label for="mute-until">Muted until (pick a date and time)</label>
  <input class="field" id="mute-until" type="datetime-local">
  <div class="err" id="mute-error"></div>
  <div class="row" style="justify-content:flex-end;margin-top:6px">
    <button class="btn ghost" data-action="closeMute" type="button">Cancel</button>
    <button class="btn gold" data-action="submitMute" type="button">Mute</button>
  </div>
</dialog>

<script type="module">
/* =====================================================================
   H: how this file is organised
   1. Setup        Firebase connection, settings, icons
   2. Helpers      small tools used everywhere
   3. Accounts     sign up, verify email, log in, claim username
   4. Screens      the HTML for each page
   5. Live data    feed, groups and messages that update by themselves
   6. Actions      what happens when someone taps a button
   7. Start        connect buttons to actions and begin
   ===================================================================== */


/* ---------- 1. SETUP ---------- */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification,
  sendPasswordResetEmail, onAuthStateChanged, signOut, updatePassword,
  reauthenticateWithCredential, EmailAuthProvider,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, deleteField, writeBatch,
  serverTimestamp, Timestamp, collection, query, where, orderBy, limit, onSnapshot,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQZIYb0UY9IOFrFe-FASDEQpt98Tos0pM",
  authDomain: "h-social-8fc49.firebaseapp.com",
  projectId: "h-social-8fc49",
  appId: "1:158431546745:web:5b8f778ce903f4e45333a8",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const MAX_POST = 500;        // longest post, in characters
const FEED_SIZE = 50;        // posts loaded on Home
const USERNAME_RULE = /^[a-z0-9_]{3,16}$/;
const PENDING_USERNAME_KEY = "hsocial.pendingUsername";
const JOIN_KEY = "hsocial.pendingJoin";

// Change TERMS_VERSION whenever the terms change: everyone is asked to agree again.
const TERMS_VERSION = "2026-11-25";
const TERMS_HTML = `
  <h3>Terms of Use</h3>
  <p class="muted small">Last updated 25 November 2026. By using H you agree to these terms.</p>
  <h4>1. Your account</h4>
  <p>Use a real email you control. You are responsible for what happens on your account. Keep your password private.</p>
  <h4>2. What you can post</h4>
  <p>Do not post anything illegal, threatening, harassing or hateful. Do not post sexual content involving minors, scams, or other people's private information. We can remove content and suspend accounts that break these rules.</p>
  <h4>3. Anonymous chat</h4>
  <p>In groups that turn on anonymous chat, your name is hidden from other members and from group admins. However, the H team keeps a private record that links every anonymous message to the account that sent it. We may use that record to investigate reports, enforce these rules, protect people from harm, and respond to lawful requests from authorities. Anonymous to other members does not mean untraceable by the H team.</p>
  <h4>4. Reports and moderation</h4>
  <p>You can report posts and messages. The H team reviews reports and may delete content or restrict accounts. Group admins can also delete messages, mute members and lock groups.</p>
  <h4>5. Your information</h4>
  <p>We store your email, username, name, posts, messages and the records described above, using Google Firebase.</p>
  <h4>6. Changes</h4>
  <p>We may update these terms. If we do, you may be asked to agree again.</p>`;

const TABS = [
  { id: "home",   label: "Home" },
  { id: "search", label: "Search" },
  { id: "chat",   label: "Chat" },
  { id: "wallet", label: "Wallet" },     // wallet is always last
];

const ICONS = {
  home:   '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  chat:   '<path d="M21 12a8 8 0 0 1-11.6 7.1L3 20l1-4.6A8 8 0 1 1 21 12z"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h14v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/>',
  back:   '<path d="M15 5l-7 7 7 7"/>',
  send:   '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>',
  eye:    '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};


/* ---------- 2. HELPERS ---------- */

const $ = (selector) => document.querySelector(selector);
const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

// Makes user text safe to put inside HTML.
function esc(text) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(text).replace(/[&<>"']/g, (c) => map[c]);
}

// Post text: safe HTML, with @username turned into a tappable mention.
function richText(text) {
  return esc(text).replace(/(^|[^a-z0-9_])@([a-z0-9_]{3,16})/gi,
    (all, before, name) => name.toLowerCase() === "everyone"
      ? `${before}<span class="everyone-tag">@everyone</span>`
      : `${before}<button class="mention" data-action="openProfileByName" data-username="${name.toLowerCase()}">@${name}</button>`);
}

function timeAgo(timestamp) {
  const ms = timestamp ? timestamp.toMillis() : Date.now();
  const minutes = Math.max(1, Math.round((Date.now() - ms) / 60000));
  if (minutes < 60) return minutes + "m";
  if (minutes < 1440) return Math.round(minutes / 60) + "h";
  return Math.round(minutes / 1440) + "d";
}

function joinedText(timestamp) {
  if (!timestamp) return "";
  return "Joined " + timestamp.toDate().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

// A round avatar with the first letter, coloured from the name.
function avatar(person, size = "") {
  const label = person.name || person.username || "?";
  let hue = 0;
  for (const letter of label) hue = (hue * 31 + letter.charCodeAt(0)) % 360;
  return `<div class="av ${size}" style="background:hsl(${hue} 40% 40%)">${esc(label[0].toUpperCase())}</div>`;
}

let toastTimer;
function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function friendlyError(code) {
  const messages = {
    "app/username-taken": "That username is taken. Try another.",
    "auth/email-already-in-use": "An account with this email already exists. Log in instead.",
    "auth/invalid-email": "Enter a valid email.",
    "auth/weak-password": "Password must be at least 8 characters.",
    "auth/invalid-credential": "Wrong email or password.",
    "auth/wrong-password": "Wrong password.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
    "auth/network-request-failed": "No connection. Check your internet and try again.",
    "auth/requires-recent-login": "For safety, log out and log in again, then retry.",
  };
  return messages[code] || "Something went wrong. Try again.";
}

function randomCode() {
  const letters = "abcdefghijkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), (n) => letters[n % 32]).join("");
}


/* ---------- 3. ACCOUNTS ---------- */
/* Sign up -> verify email -> only then is the username claimed.
   So nobody can hold a username without a verified email. */

let screen = "loading";          // loading, login, signup, reset, verify, choose, app
let me = null;                   // { uid, username, name, joinedAt }
let isSigningUp = false;
let verifyTimer = null;

function savePendingUsername(uid, username) {
  try { localStorage.setItem(PENDING_USERNAME_KEY, JSON.stringify({ uid, username })); } catch (error) {}
}
function readPendingUsername(uid) {
  try {
    const saved = JSON.parse(localStorage.getItem(PENDING_USERNAME_KEY));
    return saved && saved.uid === uid ? saved.username : null;
  } catch (error) { return null; }
}
function clearPendingUsername() {
  try { localStorage.removeItem(PENDING_USERNAME_KEY); } catch (error) {}
}

function showAuthError(message) {
  const box = $("#auth-error");
  if (box) box.textContent = message;
}

// Claim a username (needs a verified email). Returns the new profile, or null if taken.
async function claimUsername(uid, username) {
  try {
    if ((await getDoc(doc(db, "usernames", username))).exists()) return null;
    const batch = writeBatch(db);
    batch.set(doc(db, "usernames", username), { uid });
    batch.set(doc(db, "users", uid), { username, createdAt: serverTimestamp() });
    batch.set(doc(db, "profiles", uid), { username, name: username, joinedAt: serverTimestamp(), terms: TERMS_VERSION });
    await batch.commit();
    clearPendingUsername();
    return (await getDoc(doc(db, "profiles", uid))).data();
  } catch (error) {
    return null;
  }
}

// Finds the person's profile, or creates it the first time they are verified.
async function loadOrCreateProfile(user) {
  const profileRef = doc(db, "profiles", user.uid);
  const existing = await getDoc(profileRef);
  if (existing.exists()) return existing.data();

  // Accounts made before profiles existed already own a username.
  const older = await getDoc(doc(db, "users", user.uid));
  if (older.exists()) {
    const migrated = { username: older.data().username, name: older.data().username, joinedAt: older.data().createdAt };
    await setDoc(profileRef, migrated);
    return migrated;
  }

  const wanted = readPendingUsername(user.uid);
  return wanted ? claimUsername(user.uid, wanted) : null;
}

// Decides which screen a signed-in (or signed-out) person should see.
async function routeUser(user) {
  clearInterval(verifyTimer);
  if (!user) {
    stopLiveData();
    me = null;
    if (screen !== "signup" && screen !== "reset") screen = "login";
    return render();
  }
  if (!user.emailVerified) {
    screen = "verify";
    render();
    startVerifyPolling();
    return;
  }
  try {
    await user.getIdToken(true);   // refresh so the database knows the email is verified
    if ((await getDoc(doc(db, "bans", user.uid))).exists()) { screen = "banned"; return render(); }
    const profile = await loadOrCreateProfile(user);
    if (!profile) { screen = "choose"; return render(); }
    me = { uid: user.uid, ...profile };
    if (profile.terms !== TERMS_VERSION) { screen = "terms"; return render(); }   // ask to agree (once per version)
    startLiveData();
    screen = "app";
    render();
    processPendingJoin();
  } catch (error) {
    screen = "login";
    render();
    showAuthError("Could not load your account. Check your connection and log in again.");
  }
}

// While the verify screen is open, check every few seconds so the person
// is taken into the app automatically after opening the email link.
function startVerifyPolling() {
  clearInterval(verifyTimer);
  verifyTimer = setInterval(async () => {
    if (!auth.currentUser) return;
    await auth.currentUser.reload();
    if (auth.currentUser.emailVerified) routeUser(auth.currentUser);
  }, 4000);
}

const currentListHtml = () => (roomMode === "anon" ? anonHtml() : messagesHtml());

  return `<div class="seg">

function roomView() {

  return `<div class="room">

// Locks the message box when the group is locked (and you are not an admin) or you are muted.
function refreshRoomState() {
  if (!openGroup || !$("#room-head")) return;
  $("#room-head").innerHTML = roomHeadHtml(openGroup);
  $("#room-tools").innerHTML = roomToolsHtml(openGroup);
  $("#room-seg").innerHTML = segHtml();
  const inAnon = roomMode === "anon";
  const lockedOut = openGroup.locked && !isAdmin(openGroup);
  // Lock and mute apply to the normal chat only. Anonymous chat just needs to be open.
  const blocked = inAnon ? !openGroup.anonOpen : (lockedOut || isMuted());
  $("#group-text").disabled = blocked;
  $("#group-send").disabled = blocked;
  $("#group-text").placeholder = inAnon
    ? (openGroup.anonOpen ? "Send anonymously" : "Anonymous chat is closed. An admin opens it when it is time.")
    : isMuted() ? "You are muted until " + niceTime(mutedUntilMs())
    : lockedOut ? "This group is locked. Only admins can send messages." : "Message";
  updateMessages();
}

function updateMessages() {
  const list = $("#group-messages");
  if (!list) return;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  list.innerHTML = currentListHtml();
  if (nearBottom) list.scrollTop = list.scrollHeight;
}


/* ---------- 5. LIVE DATA ---------- */
/* Firebase pushes changes to us, so feeds and chats update without refreshing. */

let posts = [];                  // latest posts from everyone
let publicGroups = [];           // public groups anyone can see
let myGroups = [];               // groups you made or joined (including private)
let openGroupId = null;          // the chat room you are in
let openGroup = null;
let messages = [];
let requests = [];              // people waiting for approval (admins only)
let myMember = null;            // your own membership record (has your mute time)
let roomTimer = null;
let reportTarget = null;
let reportsCache = [];
let isOwner = false;               // true only for the app owner (set in the database by hand)
let lastAnonSend = 0;
let anonMessages = [];          // anonymous messages: only text and time, no sender
let roomMode = "chat";          // "chat" or "anon"
let stopAnon = null;
let panelMode = null;           // "requests" or "members" while the panel is open
let muteTargetUid = null;
let editingMessageId = null;
let inputMode = null;            // what the small popup is for
let stopFeed, stopPublic, stopMine, stopGroupDoc, stopMessages, stopMember, stopRequests;

const isCreator = (group) => group.creatorUid === me.uid || isOwner;   // the app owner has creator powers everywhere
const isAdmin = (group) => isCreator(group) || Boolean(group.admins && group.admins[me.uid]);

function startLiveData() {
  if (stopFeed) return;
  getDoc(doc(db, "owners", me.uid)).then((s) => { isOwner = s.exists(); if (profileUid === me.uid) render(); }).catch(() => {});
  const latest = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(FEED_SIZE));
  stopFeed = onSnapshot(latest, (snapshot) => {
    posts = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    const feed = $("#feed");
    if (feed && tab === "home" && !profileUid) feed.innerHTML = postsHtml(posts);
  }, () => {});

  const publicQuery = query(collection(db, "groups"), where("private", "==", false), limit(100));
  stopPublic = onSnapshot(publicQuery, (snapshot) => {
    publicGroups = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    publicGroups.sort((a, b) => (b.createdAt?.toMillis() || Date.now()) - (a.createdAt?.toMillis() || Date.now()));
    refreshGroupsList();
  }, () => {});

  stopMine = onSnapshot(collection(db, "users", me.uid, "myGroups"), (snapshot) => {
    myGroups = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    refreshGroupsList();
  }, () => {});
}

function refreshGroupsList() {
  const list = $("#groups-list");
  if (list && tab === "chat" && !profileUid && !openGroupId) list.innerHTML = groupsListHtml();
}

function stopWatchingGroup() {
  [stopGroupDoc, stopMessages, stopMember, stopRequests, stopAnon].forEach((stop) => stop && stop());
  stopGroupDoc = stopMessages = stopMember = stopRequests = stopAnon = null;
  clearInterval(roomTimer);
  openGroupId = openGroup = myMember = null;
  messages = [];
  requests = [];
  anonMessages = [];
  roomMode = "chat";
}

function stopLiveData() {
  [stopFeed, stopPublic, stopMine].forEach((stop) => stop && stop());
  stopFeed = stopPublic = stopMine = null;
  posts = publicGroups = myGroups = [];
  profileUid = profileData = null;
  isOwner = false;
  stopWatchingGroup();
}

function watchGroup(groupId) {
  stopWatchingGroup();
  openGroupId = groupId;
  stopGroupDoc = onSnapshot(doc(db, "groups", groupId), (snapshot) => {
    const firstLoad = !openGroup;
    openGroup = snapshot.exists() ? { id: snapshot.id, ...snapshot.data() } : null;
    if (!openGroup) return actions.closeGroup();
    if (isAdmin(openGroup) && !stopRequests) watchRequests(groupId);   // only admins see join requests
    if (openGroup.anonymous && !stopAnon) watchAnon(groupId);
    if (!openGroup.anonymous && stopAnon) { stopAnon(); stopAnon = null; anonMessages = []; roomMode = "chat"; }
    if (firstLoad) render(); else refreshRoomState();
  }, () => { toast("You can't open this group."); actions.closeGroup(); });

  stopMember = onSnapshot(doc(db, "groups", groupId, "members", me.uid), (snapshot) => {
    myMember = snapshot.exists() ? snapshot.data() : null;
    refreshRoomState();
  }, () => {});

  const latest = query(collection(db, "groups", groupId, "messages"), orderBy("createdAt", "desc"), limit(100));
  stopMessages = onSnapshot(latest, (snapshot) => {
    messages = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    updateMessages();
  }, () => {});

  roomTimer = setInterval(refreshRoomState, 30000);   // so a mute ends on screen by itself
}

function watchAnon(groupId) {
  const latest = query(collection(db, "groups", groupId, "anon"), orderBy("createdAt", "desc"), limit(100));
  stopAnon = onSnapshot(latest, (snapshot) => {
    anonMessages = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    if (roomMode === "anon") updateMessages();
  }, () => {});
}

function watchRequests(groupId) {
  stopRequests = onSnapshot(collection(db, "groups", groupId, "requests"), (snapshot) => {
    requests = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    refreshRoomState();
    if (panelMode === "requests") renderRequestsPanel();
  }, () => {});
}

// Private groups carry a secret code in the link; public ones do not.
async function inviteLink(group) {
  let code = "";
  if (group.private) {
    const secret = await getDoc(doc(db, "groups", group.id, "secret", "code"));
    if (secret.exists()) code = "." + secret.data().code;
  }
  return location.origin + location.pathname + "#group=" + group.id + code;
}

// Join (or ask to join) a group. If the group needs approval, an admin decides.
async function joinGroup(groupId, code) {
  try {
    const memberRef = doc(db, "groups", groupId, "members", me.uid);
    if ((await getDoc(memberRef)).exists()) {
      tab = "chat"; profileUid = null; watchGroup(groupId); render();
      return;
    }
    const requestRef = doc(db, "groups", groupId, "requests", me.uid);
    if ((await getDoc(requestRef)).exists()) return toast("You already asked to join. Wait for an admin.");

    const found = await getDoc(doc(db, "groups", groupId));
    if (!found.exists()) throw new Error("missing");
    const group = found.data();
    const mineRef = doc(db, "users", me.uid, "myGroups", groupId);
    const batch = writeBatch(db);

    if (group.needsApproval) {
      batch.set(requestRef, group.private
        ? { username: me.username, code, createdAt: serverTimestamp() }
        : { username: me.username, createdAt: serverTimestamp() });
      batch.set(mineRef, { name: group.name, private: group.private, pending: true });
      await batch.commit();
      tab = "chat"; profileUid = null; render();
      toast("Request sent. An admin will review it.");
      return;
    }
    batch.set(memberRef, group.private
      ? { username: me.username, code, joinedAt: serverTimestamp() }
      : { username: me.username, joinedAt: serverTimestamp() });
    batch.set(mineRef, { name: group.name, private: group.private, pending: false });
    await batch.commit();
    tab = "chat"; profileUid = null; watchGroup(groupId); render();
  } catch (error) {
    toast("That invite link is not valid, or the group no longer exists.");
  }
}

function renderMembersPanel(list) {
  $("#panel-title").textContent = "Members";
  $("#panel-body").innerHTML = list.map((m) => {
    const isGroupCreator = m.id === openGroup.creatorUid;
    const isAdminMember = Boolean(openGroup.admins && openGroup.admins[m.id]);
    const muted = m.mutedUntil && m.mutedUntil.toMillis() > Date.now();
    const canManage = m.id !== me.uid && (isOwner || (!isGroupCreator && (isCreator(openGroup) || !isAdminMember)));
    return `<div class="member">${avatar({ name: m.username }, "s")}
      <div class="grow"><div class="name">@${esc(m.username)}${isGroupCreator ? " · creator" : isAdminMember ? " · admin" : ""}</div>
      ${muted ? `<div class="muted small">Muted until ${niceTime(m.mutedUntil.toMillis())}</div>` : ""}</div>
      ${canManage ? (muted
        ? `<button class="btn ghost" data-action="unmuteMember" data-uid="${esc(m.id)}">Unmute</button>`
        : `<button class="btn ghost" data-action="openMute" data-uid="${esc(m.id)}">Mute</button>`) : ""}</div>`;
  }).join("");
}

// Remember a link opened before logging in, so it works after sign-up.
function rememberJoinLink() {
  const match = location.hash.match(/^#group=([A-Za-z0-9]+)(?:\.([a-z0-9]+))?$/);
  if (!match) return;
  try { localStorage.setItem(JOIN_KEY, JSON.stringify({ id: match[1], code: match[2] || "" })); } catch (error) {}
  history.replaceState(null, "", location.pathname);
}

async function processPendingJoin() {
  let pending = null;
  try {
    pending = JSON.parse(localStorage.getItem(JOIN_KEY));
    localStorage.removeItem(JOIN_KEY);
  } catch (error) {}
  if (pending) await joinGroup(pending.id, pending.code);
}

async function openProfileByUid(uid) {
  profileUid = uid;
  profileData = null;
  profilePosts = [];
  render();
  window.scrollTo(0, 0);
  try {
    const snap = await getDoc(doc(db, "profiles", uid));
    profileData = snap.exists() ? snap.data() : { username: "unknown", name: "Unknown user" };
    const found = await getDocs(query(collection(db, "posts"), where("uid", "==", uid), limit(100)));

      .sort((a, b) => (b.createdAt?.toMillis() || Date.now()) - (a.createdAt?.toMillis() || Date.now()));
  } catch (error) {
    toast("Could not load this profile.");
  }
  if (profileUid === uid) render();
}

/* ---------- 6. ACTIONS ---------- */
/* Each action is one thing the person can do. Buttons name an action with
   data-action="...", and section 7 connects the two. */

const actions = {

  /* ----- moving around ----- */
  goTab({ tab: next }) {
    tab = next;
    profileUid = profileData = null;
    render();
    window.scrollTo(0, 0);
  },
  openProfile({ uid }) { openProfileByUid(uid); },
  async openProfileByName({ username }) {
    try {
      const found = await getDoc(doc(db, "usernames", username));
      if (!found.exists()) return toast("No one has the username @" + username);
      openProfileByUid(found.data().uid);
    } catch (error) { toast("Could not open that profile."); }
  },
  backFromProfile() { profileUid = profileData = null; render(); },
  buyCredits() { toast("Buying credits will work once payments are connected."); },

  /* ----- sign up, log in, password ----- */
  showLogin()  { screen = "login";  render(); },
  showSignup() { screen = "signup"; render(); },
  showReset()  { screen = "reset";  render(); },

  toggleEye({ target }) {
    const field = document.getElementById(target);
    field.type = field.type === "password" ? "text" : "password";
  },

  async signUp() {
    const email = $("#email-input").value.trim();
    const username = $("#username-input").value.trim().toLowerCase();
    const password = $("#password-input").value;
    const again = $("#password-again").value;

    if (!email.includes("@")) return showAuthError("Enter a valid email.");
    if (!USERNAME_RULE.test(username)) return showAuthError("Username: 3 to 16 letters, numbers or underscores.");
    if (password.length < 8) return showAuthError("Password must be at least 8 characters.");
    if (password !== again) return showAuthError("The two passwords don't match.");
    if (!$("#terms-check").checked) return showAuthError("Please agree to the Terms to continue.");

    isSigningUp = true;
    try {
      if ((await getDoc(doc(db, "usernames", username))).exists()) throw { code: "app/username-taken" };
      const created = await createUserWithEmailAndPassword(auth, email, password);
      savePendingUsername(created.user.uid, username);   // claimed after the email is verified
      try { await sendEmailVerification(created.user); } catch (error) { /* they can resend */ }
    } catch (error) {
      isSigningUp = false;
      return showAuthError(friendlyError(error.code));
    }
    isSigningUp = false;
    routeUser(auth.currentUser);
  },

  async logIn() {
    try {
      await signInWithEmailAndPassword(auth, $("#email-input").value.trim(), $("#password-input").value);
    } catch (error) { showAuthError(friendlyError(error.code)); }
  },

  async sendReset() {
    const email = $("#email-input").value.trim();
    if (!email.includes("@")) return showAuthError("Enter a valid email.");
    try {
      await sendPasswordResetEmail(auth, email);
    } catch (error) {
      if (error.code !== "auth/user-not-found") return showAuthError(friendlyError(error.code));
    }
    screen = "login";
    render();
    toast("If that email has an account, a reset link is on its way.");
  },

  async checkVerified() {
    await auth.currentUser.reload();
    if (!auth.currentUser.emailVerified) return showAuthError("Not verified yet. Open the link in your email first.");
    routeUser(auth.currentUser);
  },

  async resendEmail() {
    try { await sendEmailVerification(auth.currentUser); toast("Verification email sent"); }
    catch (error) { showAuthError(friendlyError(error.code)); }
  },

  async chooseUsername() {
    const username = $("#username-input").value.trim().toLowerCase();
    if (!USERNAME_RULE.test(username)) return showAuthError("Username: 3 to 16 letters, numbers or underscores.");
    const profile = await claimUsername(auth.currentUser.uid, username);
    if (!profile) return showAuthError("That username is taken. Try another.");
    routeUser(auth.currentUser);
  },

  openTerms() {
    $("#terms-body").innerHTML = TERMS_HTML;
    $("#terms-dialog").showModal();
  },
  closeTerms() { $("#terms-dialog").close(); },

  async acceptTerms() {
    try {
      await updateDoc(doc(db, "profiles", me.uid), { terms: TERMS_VERSION });
      routeUser(auth.currentUser);
    } catch (error) { showAuthError("Could not save. Check your connection and try again."); }
  },

  async logOut() { stopLiveData(); await signOut(auth); },

  openChangePassword() {
    $("#password-fields").innerHTML = passwordField("pw-current", "Current password", "current-password")
      + passwordField("pw-new", "New password", "new-password") + passwordField("pw-again", "Confirm new password", "new-password");
    $("#password-error").textContent = "";
    $("#password-dialog").showModal();
  },
  closePasswordDialog() { $("#password-dialog").close(); },

  async submitPassword() {
    const current = $("#pw-current").value, next = $("#pw-new").value, again = $("#pw-again").value;
    const error = $("#password-error");
    if (next.length < 8) return (error.textContent = "New password must be at least 8 characters.");
    if (next !== again) return (error.textContent = "The two new passwords don't match.");
    try {
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, current));
      await updatePassword(auth.currentUser, next);
      $("#password-dialog").close();
      toast("Password changed");
    } catch (failure) {
      error.textContent = failure.code === "auth/invalid-credential" ? "Your current password is wrong." : friendlyError(failure.code);
    }
  },

  /* ----- posts and search ----- */
  async publishPost() {
    const box = $("#post-text");
    const text = box.value.trim();
    if (!text) return toast("Write something first.");
    if (text.length > MAX_POST) return toast("Posts can be up to " + MAX_POST + " characters.");
    const words = [...new Set(text.toLowerCase().match(/[\p{L}\p{N}_]{2,}/gu) || [])].slice(0, 40);
    const mentions = [...new Set((text.toLowerCase().match(/@([a-z0-9_]{3,16})/g) || []).map((m) => m.slice(1)))].slice(0, 10);
    try {
      await addDoc(collection(db, "posts"), {
        uid: me.uid, author: me.username, name: me.name, text, words, mentions, createdAt: serverTimestamp(),
      });
      box.value = "";
      $("#char-count").textContent = MAX_POST;
    } catch (error) { toast("Could not post. Check your connection and try again."); }
  },

  async deletePost({ id }) {
    if (!confirm("Delete this post?")) return;
    try {
      await deleteDoc(doc(db, "posts", id));
      profilePosts = profilePosts.filter((p) => p.id !== id);
      if (profileUid) render();
    } catch (error) { toast("Could not delete the post."); }
  },

  async runSearch() {
    const box = $("#search-input");
    const results = $("#search-results");
    const term = box.value.trim().toLowerCase().replace(/^@/, "");
    if (!term) return;
    results.innerHTML = '<div class="empty">Searching…</div>';
    try {
      const people = await getDocs(query(collection(db, "profiles"),
        where("username", ">=", term), where("username", "<=", term + "\uf8ff"), limit(10)));
      const firstWord = term.match(/[\p{L}\p{N}_]{2,}/u);
      const found = firstWord ? await getDocs(query(collection(db, "posts"), where("words", "array-contains", firstWord[0]), limit(30))) : { docs: [] };
      const matches = found.docs.map((item) => ({ id: item.id, ...item.data() }))
        .filter((p) => term.split(/\s+/).every((word) => p.text.toLowerCase().includes(word)))
        .sort((a, b) => (b.createdAt?.toMillis() || Date.now()) - (a.createdAt?.toMillis() || Date.now()));
      results.innerHTML =
        (people.docs.length ? `<h3 class="sec">People</h3>${people.docs.map((p) => personRow(p.data(), p.id)).join("")}` : "")
        + (matches.length ? `<h3 class="sec">Posts</h3>${matches.map(postHtml).join("")}` : "")
        + (!people.docs.length && !matches.length ? '<div class="empty">Nothing found. Try another word.</div>' : "");
    } catch (error) { results.innerHTML = '<div class="empty">Search failed. Try again.</div>'; }
  },

  /* ----- your profile ----- */
  openEditName() { openInputDialog("editName", "Edit name", "Your name", "Your name", me.name); },
  openChangeUsername() { openInputDialog("changeUsername", "Change username", "New username", "e.g. hteam2"); },

  /* ----- groups and chat ----- */
  openGroup({ id }) {
    const mine = myGroups.find((g) => g.id === id);
    if (mine && mine.pending) return toast("Waiting for an admin to approve your request.");
    if (!mine && isOwner) { watchGroup(id); render(); return; }   // the owner can open any group
    if (!mine) return joinGroup(id, "");        // a public group you have not joined yet
    watchGroup(id);
    render();
  },
  closeGroup() { stopWatchingGroup(); render(); },
  openCreateGroup() { openInputDialog("createGroup", "Create group", "Group name", "e.g. HGROUP"); },
  openAddAdmin()    { openInputDialog("addAdmin", "Add admin", "Username of the new admin", "e.g. hteam"); },
  closeInputDialog() { $("#input-dialog").close(); },

  editMessage({ id }) {
    editingMessageId = id;
    openInputDialog("editMessage", "Edit message", "Your message", "", messages.find((m) => m.id === id).text);
  },

  async submitInput() {
    const value = $("#input-value").value.trim();
    const error = $("#input-error");
    try {
      if (inputMode === "createGroup") {
        if (!value || value.length > 40) return (error.textContent = "Enter a group name of 1 to 40 characters.");
        const isPrivate = $("#input-private").checked;
        const groupRef = doc(collection(db, "groups"));
        const batch = writeBatch(db);
        batch.set(groupRef, {
          name: value, creatorUid: me.uid, creatorName: me.username, admins: {},
          locked: false, private: isPrivate, needsApproval: $("#input-approval").checked, anonymous: $("#input-anon").checked, anonOpen: false, createdAt: serverTimestamp(),
        });
        batch.set(doc(db, "groups", groupRef.id, "secret", "code"), { code: randomCode() });
        batch.set(doc(db, "groups", groupRef.id, "members", me.uid), { username: me.username, joinedAt: serverTimestamp() });
        batch.set(doc(db, "users", me.uid, "myGroups", groupRef.id), { name: value, private: isPrivate, pending: false });
        await batch.commit();
        $("#input-dialog").close();
        actions.openGroup({ id: groupRef.id });

      } else if (inputMode === "addAdmin") {
        const username = value.toLowerCase().replace(/^@/, "");
        const found = await getDoc(doc(db, "usernames", username));
        if (!found.exists()) return (error.textContent = "No one has that username.");
        if (found.data().uid === me.uid) return (error.textContent = "You made this group, so you are already an admin.");
        await updateDoc(doc(db, "groups", openGroupId), { ["admins." + found.data().uid]: username });
        $("#input-dialog").close();
        toast("@" + username + " is now an admin");

      } else if (inputMode === "editMessage") {
        if (!value) return (error.textContent = "A message can't be empty.");
        await updateDoc(doc(db, "groups", openGroupId, "messages", editingMessageId), { text: value, editedAt: serverTimestamp() });
        $("#input-dialog").close();

      } else if (inputMode === "banUser") {
        const username = value.toLowerCase().replace(/^@/, "");
        const found = await getDoc(doc(db, "usernames", username));
        if (!found.exists()) return (error.textContent = "No one has that username.");
        if (found.data().uid === me.uid) return (error.textContent = "You can't ban yourself.");
        await setDoc(doc(db, "bans", found.data().uid), { username, createdAt: serverTimestamp() });
        $("#input-dialog").close();
        toast("@" + username + " is banned");
        actions.openBans();

      } else if (inputMode === "report") {
        if (value.length < 3) return (error.textContent = "Tell us briefly why you are reporting this.");
        await addDoc(collection(db, "reports"), {
          reporterUid: me.uid, reporter: me.username, kind: reportTarget.kind, targetId: reportTarget.id,
          groupId: reportTarget.groupId, text: reportTarget.text, reason: value.slice(0, 200), status: "open", createdAt: serverTimestamp(),
        });
        $("#input-dialog").close();
        toast("Report sent. Thank you.");

      } else if (inputMode === "editName") {
        if (!value || value.length > 30) return (error.textContent = "Enter a name of 1 to 30 characters.");
        await updateDoc(doc(db, "profiles", me.uid), { name: value });
        me.name = profileData.name = value;
        $("#input-dialog").close();
        render();

      } else if (inputMode === "changeUsername") {
        const next = value.toLowerCase().replace(/^@/, "");
        if (!USERNAME_RULE.test(next)) return (error.textContent = "Username: 3 to 16 letters, numbers or underscores.");
        if (next === me.username) return (error.textContent = "That is already your username.");
        if ((await getDoc(doc(db, "usernames", next))).exists()) return (error.textContent = "That username is taken. Try another.");
        // One batch: free the old username, claim the new one, update your profile.
        const batch = writeBatch(db);
        batch.delete(doc(db, "usernames", me.username));
        batch.set(doc(db, "usernames", next), { uid: me.uid });
        batch.update(doc(db, "users", me.uid), { username: next });
        batch.update(doc(db, "profiles", me.uid), { username: next });
        await batch.commit();
        me.username = profileData.username = next;
        $("#input-dialog").close();
        render();
        toast("Username changed to @" + next);
      }
    } catch (failure) {
      error.textContent = "That did not work. It may have just been taken, or check your connection.";
    }
  },

  async deleteReported({ id }) {

    const target = report.kind === "post" ? doc(db, "posts", report.targetId)
      : report.kind === "message" ? doc(db, "groups", report.groupId, "messages", report.targetId)

      await deleteDoc(target);

      reportsCache = reportsCache.filter((r) => r.id !== id);
      renderReportsPanel();
      toast("Content deleted");
    } catch (failure) { toast("Could not delete it. Try again."); }

      await updateDoc(doc(db, "reports", id), { status: "resolved" });
      reportsCache = reportsCache.filter((r) => r.id !== id);
      renderReportsPanel();
    } catch (failure) { toast("Could not update the report."); }
  },

  async traceAnon({ id }) {
    const report = reportsCache.find((r) => r.id === id);
    try {
      const log = await getDoc(doc(db, "anonLog", report.targetId));
      $("#trace-" + id).textContent = log.exists() ? "Sender: @" + log.data().username : "No sender record found.";
    } catch (failure) { toast("Could not look that up."); }

  // Owner only: see every group, including private ones, and open any of them.

    $("#panel-title").textContent = "All groups (owner only)";
    $("#panel-body").innerHTML = '<div class="empty">Loading…</div>';
    $("#panel-dialog").showModal();
    try {
      const found = await getDocs(query(collection(db, "groups"), limit(200)));
      $("#panel-body").innerHTML = found.docs.length ? found.docs.map((item) => {
        const g = item.data();
        return `<div class="member">${avatar({ name: g.name }, "s")}
          <div class="grow"><div class="name">${esc(g.name)}</div><div class="muted small">${g.private ? "Private" : "Public"} · by @${esc(g.creatorName)}</div></div>
          <button class="btn ghost" data-action="openGroupFromPanel" data-id="${esc(item.id)}">Open</button></div>`;
      }).join("") : '<div class="empty">No groups yet.</div>';
    } catch (failure) { $("#panel-body").innerHTML = '<div class="empty">Could not load the groups.</div>'; }
  },

  openGroupFromPanel({ id }) {
    panelMode = null;
    $("#panel-dialog").close();
    tab = "chat";
    profileUid = null;
    watchGroup(id);
    render();
  },

  // Owner only: suspend or restore accounts.
  async openBans() {
    panelMode = "bans";
    try {
      const found = await getDocs(collection(db, "bans"));
      renderBansPanel(found.docs.map((item) => ({ id: item.id, ...item.data() })));
    } catch (failure) { return toast("Could not load the bans."); }
    if (!$("#panel-dialog").open) $("#panel-dialog").showModal();
  },
  openBanDialog() { openInputDialog("banUser", "Ban a user", "Username to ban", "e.g. hteam2"); },
  async unbanUser({ uid }) {
    try { await deleteDoc(doc(db, "bans", uid)); toast("User unbanned"); actions.openBans(); }
    catch (failure) { toast("Could not unban. Try again."); }
  },

  // Owner only: delete a whole group.
  async deleteGroup() {
    if (!confirm("Delete this whole group for everyone? This cannot be undone.")) return;
    try { await deleteDoc(doc(db, "groups", openGroupId)); toast("Group deleted"); }
    catch (failure) { toast("Could not delete the group."); }
  },

  // Admins open or close the anonymous chat when it is time.
  async toggleAnonOpen() {
    try {
      await updateDoc(doc(db, "groups", openGroupId), { anonOpen: !openGroup.anonOpen });
      toast(openGroup.anonOpen ? "Anonymous chat closed" : "Anonymous chat is open");
    } catch (failure) { toast("Could not change it. Try again."); }
  },

  // Owner only: who sent each anonymous message, across all groups.
  async openAnonLog() {
    panelMode = "anonlog";
    $("#panel-title").textContent = "Anonymous log (owner only)";
    $("#panel-body").innerHTML = '<div class="empty">Loading…</div>';
    $("#panel-dialog").showModal();
    try {
      const found = await getDocs(query(collection(db, "anonLog"), orderBy("createdAt", "desc"), limit(100)));
      $("#panel-body").innerHTML = found.docs.length ? found.docs.map((item) => {
        const m = item.data();
        return `<div class="member" style="flex-direction:column;align-items:flex-start;gap:2px">
          <div class="name">@${esc(m.username)} <span class="muted small">· ${esc(m.groupName)} · ${timeAgo(m.createdAt)}</span></div>
          <div style="overflow-wrap:anywhere">${esc(m.text)}</div></div>`;
      }).join("") : '<div class="empty">No anonymous messages yet.</div>';
    } catch (failure) { $("#panel-body").innerHTML = '<div class="empty">You do not have access to this log.</div>'; }
  },

  // Turn anonymous chat on or off for this group.
  async toggleAnonymous() {
    try {
      await updateDoc(doc(db, "groups", openGroupId), { anonymous: !openGroup.anonymous, anonOpen: false });
      toast(openGroup.anonymous ? "Anonymous chat turned off" : "Anonymous chat turned on");
    } catch (failure) { toast("Could not change the setting. Try again."); }
  },

  switchRoom({ mode }) {
    roomMode = mode;
    refreshRoomState();
    const list = $("#group-messages");
    if (list) list.scrollTop = list.scrollHeight;
  },

  // Only the app owner can remove an anonymous message.
  async deleteAnon({ id }) {
    if (!confirm("Delete this anonymous message?")) return;
    try { await deleteDoc(doc(db, "groups", openGroupId, "anon", id)); }
    catch (failure) { toast("Could not delete the message. Try again."); }
  },

  // Turn "admins approve new members" on or off.
  async toggleApproval() {
    try {
      await updateDoc(doc(db, "groups", openGroupId), { needsApproval: !openGroup.needsApproval });
      toast(openGroup.needsApproval ? "New members no longer need approval" : "New members now need approval");
    } catch (failure) { toast("Could not change the setting. Try again."); }
  },

  openRequests() {
    panelMode = "requests";
    renderRequestsPanel();
    $("#panel-dialog").showModal();
  },

  async approveRequest({ uid }) {
    const request = requests.find((r) => r.id === uid);
    try {
      const batch = writeBatch(db);
      batch.set(doc(db, "groups", openGroupId, "members", uid), { username: request.username, joinedAt: serverTimestamp() });
      batch.update(doc(db, "users", uid, "myGroups", openGroupId), { pending: false });
      batch.delete(doc(db, "groups", openGroupId, "requests", uid));
      await batch.commit();
      toast("@" + request.username + " was approved");
    } catch (failure) { toast("Could not approve. Try again."); }
  },

  async declineRequest({ uid }) {
    try {
      const batch = writeBatch(db);
      batch.delete(doc(db, "groups", openGroupId, "requests", uid));
      batch.delete(doc(db, "users", uid, "myGroups", openGroupId));
      await batch.commit();
    } catch (failure) {
      try { await deleteDoc(doc(db, "groups", openGroupId, "requests", uid)); }
      catch (error) { toast("Could not decline. Try again."); }
    }
  },

  async openMembers() {
    panelMode = "members";
    try {
      const found = await getDocs(collection(db, "groups", openGroupId, "members"));
      renderMembersPanel(found.docs.map((item) => ({ id: item.id, ...item.data() })));
    } catch (failure) {
      return toast("Could not load the members.");
    }
    if (!$("#panel-dialog").open) $("#panel-dialog").showModal();
  },
  closePanel() { panelMode = null; $("#panel-dialog").close(); },

  openMute({ uid }) {
    muteTargetUid = uid;
    $("#mute-until").value = "";
    $("#mute-error").textContent = "";
    $("#mute-dialog").showModal();
  },
  mutePreset({ minutes }) {
    const until = new Date(Date.now() + Number(minutes) * 60000);
    $("#mute-until").value = new Date(until.getTime() - until.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  },
  closeMute() { $("#mute-dialog").close(); },

  async submitMute() {
    const value = $("#mute-until").value;
    const error = $("#mute-error");
    const until = new Date(value);
    if (!value || Number.isNaN(until.getTime())) return (error.textContent = "Choose a date and time.");
    if (until.getTime() <= Date.now()) return (error.textContent = "Choose a time in the future.");
    try {
      await updateDoc(doc(db, "groups", openGroupId, "members", muteTargetUid), { mutedUntil: Timestamp.fromDate(until) });
      $("#mute-dialog").close();
      toast("Member muted");
      if (panelMode === "members") actions.openMembers();
    } catch (failure) { error.textContent = "Could not mute. Check your connection and try again."; }
  },

  async unmuteMember({ uid }) {
    try {
      await updateDoc(doc(db, "groups", openGroupId, "members", uid), { mutedUntil: null });
      toast("Member unmuted");
      actions.openMembers();
    } catch (failure) { toast("Could not unmute. Try again."); }
  },

  async toggleLock() {
    try {
      await updateDoc(doc(db, "groups", openGroupId), { locked: !openGroup.locked });
      toast(openGroup.locked ? "Group unlocked" : "Group locked");
    } catch (failure) { toast("Could not change the lock. Try again."); }
  },

  async sendGroupMessage() {
    const box = $("#group-text");
    const text = box.value.trim();
    if (!text) return;
    if (roomMode === "anon") {
      if (Date.now() - lastAnonSend < 3000) return toast("Slow down a little.");
      try {
        // The message itself has no sender. A separate private record, readable
        // only by the app owner, says who sent it.
        const messageRef = doc(collection(db, "groups", openGroupId, "anon"));
        const batch = writeBatch(db);
        batch.set(messageRef, { text, createdAt: serverTimestamp() });
        batch.set(doc(db, "anonLog", messageRef.id), {
          uid: me.uid, username: me.username, groupId: openGroupId, groupName: openGroup.name, text, createdAt: serverTimestamp(),
        });
        await batch.commit();
        lastAnonSend = Date.now();
        box.value = "";
        box.style.height = "auto";
      } catch (failure) { toast("Could not send. You may be muted, the group may be locked, or check your connection."); }
      return;
    }
    const everyone = /(^|[^a-z0-9_])@everyone\b/i.test(text);
    if (everyone && !isAdmin(openGroup)) return toast("Only admins can use @everyone.");
    try {
      await addDoc(collection(db, "groups", openGroupId, "messages"), {
        author: me.username, uid: me.uid, text, createdAt: serverTimestamp(),
        ...(everyone ? { everyone: true } : {}),
      });
      box.value = "";
      box.style.height = "auto";
    } catch (failure) { toast("Could not send. You may be muted, the group may be locked, or check your connection."); }
  },
};


/* ---------- 7. START ---------- */

// One listener handles every button: find its data-action and run it.
document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = actions[button.dataset.action];
  if (action) action(button.dataset);
});

// Pressing Enter in the search box searches.
document.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && event.target.id === "search-input") {
    event.preventDefault();
    actions.runSearch();
  }
});

rememberJoinLink();
render();
onAuthStateChanged(auth, (user) => { if (!isSigningUp) routeUser(user); });
</script>
</body>
