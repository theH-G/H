<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Colours, fonts and shadows live in :root. Change them here to restyle the whole app. */
:root{--bg:#fff;--surface:#fff;--soft:#f3f5f9;--ink:#12203a;--muted:#5d6b85;--line:#dde3ee;--brand:#12203a;--on-brand:#fff;--gold:#ffb300;--on-gold:#2a1d00;--pos:#0b8a5f;--neg:#c2392b;--shadow:0 1px 2px rgba(18,32,58,.06),0 8px 24px rgba(18,32,58,.06);
--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b1220;--soft:#0b1220;--surface:#141e33;--ink:#eaf0fb;--muted:#93a1bd;--line:#26334f;--brand:#ffb300;--on-brand:#2a1d00;--pos:#3ccf9a;--neg:#ff7b6b;--shadow:0 1px 2px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
/* Page layout */
.app{max-width:1020px;margin:0 auto;display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
main{padding:16px 14px 110px;max-width:640px;width:100%;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font:800 28px var(--display);letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:var(--on-brand);border:0;border-radius:99px;padding:8px 14px;font-weight:600}
/* Cards, buttons and avatars */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.compose{padding:14px;display:flex;gap:12px;margin-bottom:14px}
.compose textarea{flex:1;border:0;resize:none;background:transparent;min-height:56px;outline:none;font-size:17px}
.row{display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);color:#fff}
/* Posts */
.post{padding:14px;display:flex;gap:12px;margin-bottom:12px}
.post .body{flex:1;min-width:0}
.name{font-weight:600}.handle,.time{color:var(--muted);font-size:14px}
.text{margin:4px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{background:transparent;border:0;color:var(--muted);padding:6px 10px;border-radius:99px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.act:hover{background:var(--soft)}
.act.on{color:var(--neg)}
.act.tip{color:var(--on-gold);background:var(--gold)}
/* Wallet and history */
.wallet{padding:22px;background:var(--brand);color:var(--on-brand);margin-bottom:14px;border:0}
.wallet small{opacity:.75}
.bal{font:800 52px/1.05 var(--display);letter-spacing:-.04em;margin:6px 0 16px}
.wallet .row{flex-wrap:wrap}
.wallet .btn{background:var(--on-brand);color:var(--brand)}
.wallet .btn.gold{background:var(--gold);color:var(--on-gold)}
.sec{font-size:18px;margin:22px 2px 10px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.person:last-child{border:0}.person .grow{flex:1;min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button,.side button.t{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 18px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
nav.tabs button[aria-current="page"],.side button.t[aria-current="page"]{color:var(--ink);background:var(--soft)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Send-credits popup, forms and messages */
dialog{border:0;border-radius:22px;padding:22px;width:min(420px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,28,.55)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.err{color:var(--neg);font-size:14px;min-height:20px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.welcome{min-height:100vh;display:grid;place-items:center;padding:20px}
.welcome .card{padding:30px;max-width:420px;width:100%}
.welcome h1{font-size:40px;line-height:1.05;margin:6px 0 10px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;margin-top:16px}
/* Desktop: side menu replaces the bottom tabs */
@media (min-width:860px){
.app{grid-template-columns:230px 1fr}
.side{display:flex;flex-direction:column;gap:6px;padding:24px 14px;position:sticky;top:0;height:100vh}
.side button.t{flex-direction:row;font-size:16px;gap:12px;width:100%;justify-content:flex-start}
nav.tabs{display:none}main{padding-bottom:40px}.toast{bottom:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="send-dialog">
  <h2>Send credits</h2>
  <label for="send-to">To</label><select id="send-to"></select>
  <label for="send-amount">Amount</label><input id="send-amount" type="number" inputmode="numeric" min="1" step="1" placeholder="0">
  <label for="send-note">Note (optional)</label><input id="send-note" maxlength="60" placeholder="What's it for?">
  <div class="err" id="send-error"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px">
    <button class="btn ghost" data-action="closeSendDialog" type="button">Cancel</button>
    <button class="btn gold" data-action="submitSend" type="button">Send</button>
  </div>
</dialog>

<dialog id="input-dialog">
  <h2 id="input-title"></h2>
  <label for="input-value" id="input-label"></label>
  <textarea id="input-value" rows="2" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);resize:vertical"></textarea>
  <label id="private-row" style="display:none;font-weight:500"><input type="checkbox" id="input-private" style="width:auto;margin-right:8px">Make it private (invite-only, joined by link)</label>
  <div class="err" id="input-error"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px">
    <button class="btn ghost" data-action="closeInputDialog" type="button">Cancel</button>
    <button class="btn gold" data-action="submitInput" type="button">Save</button>
  </div>
</dialog>

<dialog id="username-dialog">
  <h2>Change username</h2>
  <label for="new-username">New username</label>
  <input id="new-username" maxlength="16" placeholder="e.g. harf_x" autocapitalize="none">
  <div class="hint">3 to 16 letters, numbers or underscores. Your old username becomes free for others.</div>
  <div class="err" id="username-error"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px">
    <button class="btn ghost" data-action="closeUsernameDialog" type="button">Cancel</button>
    <button class="btn gold" data-action="submitUsername" type="button">Save</button>
  </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendEmailVerification, sendPasswordResetEmail, onAuthStateChanged, signOut, deleteUser,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, writeBatch, serverTimestamp,
  collection, addDoc, setDoc, updateDoc, deleteDoc, deleteField, query, where, orderBy, limit, onSnapshot,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- PASTE YOUR FIREBASE CONFIG HERE ----------
   Firebase console > Project settings > Your apps > Web app > Config */
const firebaseConfig = {
  apiKey: "AIzaSyBQZIYb0UY9IOFrFe-FASDEQpt98Tos0pM",
  authDomain: "h-social-8fc49.firebaseapp.com",
  projectId: "h-social-8fc49",
  appId: "1:158431546745:web:5b8f778ce903f4e45333a8",
};
const firebaseIsSetUp = !firebaseConfig.apiKey.startsWith("PASTE");
const auth = firebaseIsSetUp ? getAuth(initializeApp(firebaseConfig)) : null;
const db = firebaseIsSetUp ? getFirestore() : null;

/* =====================================================================
   H SOCIAL: how this file is organised
   1. Settings      numbers and lists you may want to change
   2. Data          loading and saving everything the app remembers
   3. Helpers       small tools used everywhere
   4. Screens       functions that build the HTML for each page
   5. Actions       what happens when someone taps a button
   6. Start         wiring buttons to actions, then drawing the app
   ===================================================================== */


/* ---------- 1. SETTINGS ---------- */

const STORAGE_KEY = "hsocial.v2";   // name of the saved data in the browser
const START_CREDITS = 1000;         // free credits for a new profile
const PACK_CREDITS = 1000;          // credits in one pack
const PACK_PRICE_NAIRA = 150;       // price of one pack in naira
const MAX_POST_LENGTH = 280;
const HOUR = 60 * 60 * 1000;        // one hour in milliseconds

const TABS = [
  { id: "home",   label: "Home" },
  { id: "wallet", label: "Wallet" },
  { id: "community", label: "Community" },
  { id: "people", label: "People" },
];

const ICONS = {
  home:   '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h14v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"/>',
  community: '<path d="M21 12a8 8 0 0 1-11.6 7.1L3 20l1-4.6A8 8 0 1 1 21 12z"/>',
  heart:  '<path d="M12 20s-8-4.9-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6.1-8 11-8 11z"/>',
};


/* ---------- 2. DATA ---------- */

// Everything the app remembers lives in one object called "data".
function createStartingData() {
  return {
    me: null,                 // your profile: { username, name }
    currentTab: "home",
    balance: START_CREDITS,
    follows: [],              // usernames you follow
    transactions: [],         // { direction, otherUser, amount, note, time }
    users: [],                // real people will come from Firebase
    posts: [],                // your own posts on this device
  };
}

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || createStartingData();
  } catch (error) {
    return createStartingData();   // storage blocked or broken: start fresh
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    /* If saving fails the app still works, it just forgets on reload. */
  }
}

let data = loadData();
let tipTargetPostId = null;   // which post the open send popup is tipping


/* ---------- 3. HELPERS ---------- */

const $ = (selector) => document.querySelector(selector);

// Makes user text safe to put inside HTML.
function escapeHtml(text) {
  const replacements = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(text).replace(/[&<>"']/g, (char) => replacements[char]);
}

function formatNumber(number) {
  return Number(number).toLocaleString("en-NG");
}

function timeAgo(time) {
  const minutes = Math.max(1, Math.round((Date.now() - time) / 60000));
  if (minutes < 60) return minutes + "m";
  if (minutes < 1440) return Math.round(minutes / 60) + "h";
  return Math.round(minutes / 1440) + "d";
}

function findUser(username) {
  if (data.me && data.me.username === username) return data.me;
  return data.users.find((user) => user.username === username) || { username, name: username };
}

// Each person gets a steady colour made from their username.
function avatarHtml(user) {
  let hue = 0;
  for (const letter of user.username) hue = (hue * 31 + letter.charCodeAt(0)) % 360;
  const initial = escapeHtml(user.name[0].toUpperCase());
  return `<div class="av" style="background:hsl(${hue} 45% 38%)">${initial}</div>`;
}

function iconHtml(name) {
  return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
}

let toastTimer;
function showToast(message) {
  const toast = $("#toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
}


/* ---------- 4. SCREENS ---------- */

// Draws the right screen: sign-up if there is no profile, otherwise the app.
function render() {
  if (screen !== "app") {
    $("#root").innerHTML = accountScreen();
    return;
  }
  const pages = { home: homePage, wallet: walletPage, community: communityPage, people: peoplePage };
  $("#root").innerHTML = appShell(pages[data.currentTab]());

  if (data.currentTab === "community" && openGroup) refreshGroupHeader();

  // Live character counter under the post box
  const box = $("#post-text");
  if (box) {
    box.addEventListener("input", () => {
      $("#char-count").textContent = MAX_POST_LENGTH - box.value.length;
    });
  }
}

// Which account screen is showing: loading, login, signup, verify, or app.
let screen = "loading";
let isSigningUp = false;   // true while the sign-up steps are running

function accountScreen() {
  const logo = '<div class="logo">H <i>Social</i></div>';

  if (!firebaseIsSetUp) {
    return `<div class="welcome"><div class="card">${logo}
      <h1>Almost ready</h1>
      <p style="color:var(--muted)">Paste your Firebase config into the <b>firebaseConfig</b> block at the top of the script, then reload.</p></div></div>`;
  }
  if (screen === "loading") {
    return `<div class="welcome"><div class="empty">Loading…</div></div>`;
  }
  if (screen === "verify") {
    return `<div class="welcome"><div class="card">${logo}
      <h1>Check your email</h1>
      <p style="color:var(--muted)">We sent a verification link to <b>${escapeHtml(auth.currentUser.email)}</b>. Open it, then come back here.</p>
      <div class="err" id="auth-error"></div>
      <button class="btn" data-action="checkVerified" style="width:100%">I've verified my email</button>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" data-action="resendEmail">Resend email</button>
        <button class="btn ghost" data-action="logOut">Use another account</button>
      </div></div></div>`;
  }

  if (screen === "reset") {
    return `<div class="welcome"><div class="card">${logo}
      <h1>Reset your password</h1>
      <p style="color:var(--muted)">Enter your email and we'll send you a link to choose a new password.</p>
      <label for="email-input">Email</label>
      <input id="email-input" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="err" id="auth-error"></div>
      <button class="btn" data-action="sendReset" style="width:100%;margin-top:6px">Send reset link</button>
      <button class="btn ghost" data-action="showLogin" style="width:100%;margin-top:10px">Back to log in</button>
    </div></div>`;
  }

  const signingUp = screen === "signup";
  return `<div class="welcome"><div class="card">${logo}
    <h1>${signingUp ? "Create your account" : "Welcome back"}</h1>
    <label for="email-input">Email</label>
    <input id="email-input" type="email" autocomplete="email" placeholder="you@example.com">
    ${signingUp ? `<label for="username-input">Username</label>
    <input id="username-input" maxlength="16" placeholder="e.g. harf" autocapitalize="none" autocomplete="username">
    <div class="hint">3 to 16 letters, numbers or underscores. Nobody else can have it.</div>` : ""}
    <label for="password-input">Password</label>
    <input id="password-input" type="password" autocomplete="${signingUp ? "new-password" : "current-password"}" placeholder="${signingUp ? "At least 8 characters" : "Your password"}">
    <div class="err" id="auth-error"></div>
    <button class="btn" data-action="${signingUp ? "signUp" : "logIn"}" style="width:100%;margin-top:6px">${signingUp ? "Create account" : "Log in"}</button>
    <button class="btn ghost" data-action="${signingUp ? "showLogin" : "showSignup"}" style="width:100%;margin-top:10px">${signingUp ? "I already have an account" : "Create a new account"}</button>
    ${signingUp ? "" : '<button class="btn ghost" data-action="showReset" style="width:100%;margin-top:10px">Forgot password?</button>'}
    <div class="note">Test version. Credits are not real money yet.</div>
  </div></div>`;
}

// The frame around every page: top bar, side menu (desktop), bottom tabs (phone).
function appShell(pageHtml) {
  const tabButtons = (extraClass) => TABS.map((tab) => `
    <button class="${extraClass}" data-action="goToTab" data-tab="${tab.id}"
      ${data.currentTab === tab.id ? 'aria-current="page"' : ""}>
      ${iconHtml(tab.id)}<span>${tab.label}</span>
    </button>`).join("");

  return `
    <div class="app">
      <aside class="side">
        <div class="logo" style="padding:0 18px 14px">H <i>Social</i></div>
        ${tabButtons("t")}
      </aside>
      <main>
        <div class="bar">
          <div class="logo">H <i>Social</i></div>
          <button class="chip" data-action="goToTab" data-tab="wallet" aria-label="Open wallet">${formatNumber(data.balance)} cr</button>
        </div>
        ${pageHtml}
      </main>
      <nav class="tabs" aria-label="Main">${tabButtons("")}</nav>
    </div>`;
}

function postCard(post) {
  const author = findUser(post.author);
  const iLikedIt = post.likes.includes(data.me.username);
  const isMine = post.author === data.me.username;

  const tipArea = isMine
    ? `<span class="act">${formatNumber(post.tipsReceived)} cr received</span>`
    : `<button class="act tip" data-action="tipPost" data-id="${post.id}">Tip credits</button>`;

  return `
    <article class="card post">
      ${avatarHtml(author)}
      <div class="body">
        <div>
          <span class="name">${escapeHtml(author.name)}</span>
          <span class="handle">@${escapeHtml(author.username)}</span>
          <span class="time">· ${timeAgo(post.time)}</span>
        </div>
        <div class="text">${escapeHtml(post.text)}</div>
        <div class="acts">
          <button class="act ${iLikedIt ? "on" : ""}" data-action="toggleLike" data-id="${post.id}" aria-pressed="${iLikedIt}">
            ${iconHtml("heart")}${post.likes.length}
          </button>
          ${tipArea}
        </div>
      </div>
    </article>`;
}

function homePage() {
  const newestFirst = [...data.posts].sort((a, b) => b.time - a.time);
  return `
    <div class="card compose">
      ${avatarHtml(data.me)}
      <div style="flex:1">
        <textarea id="post-text" maxlength="${MAX_POST_LENGTH}" placeholder="What's happening?" aria-label="Write a post"></textarea>
        <div class="row" style="justify-content:flex-end">
          <span class="hint" id="char-count">${MAX_POST_LENGTH}</span>
          <button class="btn" data-action="publishPost">Post</button>
        </div>
      </div>
    </div>
    ${newestFirst.length ? newestFirst.map(postCard).join("") : '<div class="card empty">No posts yet. Write the first one.</div>'}`;
}

function transactionRow(tx) {
  const sent = tx.direction === "out";
  const otherUser = findUser(tx.otherUser);
  return `
    <div class="tx">
      ${avatarHtml(otherUser)}
      <div>
        <div class="name">${sent ? "Sent to" : "Received from"} @${escapeHtml(tx.otherUser)}</div>
        <div class="time">${escapeHtml(tx.note || "No note")} · ${timeAgo(tx.time)}</div>
      </div>
      <div class="amt ${sent ? "neg" : "pos"}">${sent ? "−" : "+"}${formatNumber(tx.amount)}</div>
    </div>`;
}

function walletPage() {
  const newestFirst = [...data.transactions].reverse();
  const history = newestFirst.length
    ? newestFirst.map(transactionRow).join("")
    : '<div class="empty">No transactions yet. Send credits to someone to see them here.</div>';

  return `
    <section class="card wallet">
      <small>Available balance</small>
      <div class="bal">${formatNumber(data.balance)} cr</div>
      <div class="row">
        <button class="btn gold" data-action="openSendDialog">Send credits</button>
        <button class="btn" data-action="buyCredits">Buy ${formatNumber(PACK_CREDITS)} credits · ₦${PACK_PRICE_NAIRA}</button>
      </div>
    </section>
    <h2 class="sec">History</h2>
    <div class="card">${history}</div>
    <div class="row" style="margin-top:18px">
      <button class="btn ghost" data-action="openUsernameDialog">Change username</button>
      <button class="btn ghost" data-action="logOut">Log out</button>
    </div>`;
}

function peoplePage() {
  const rows = data.users.map((user) => {
    const following = data.follows.includes(user.username);
    return `
      <div class="person">
        ${avatarHtml(user)}
        <div class="grow">
          <div class="name">${escapeHtml(user.name)}</div>
          <div class="handle">@${escapeHtml(user.username)}</div>
        </div>
        <button class="btn ghost" data-action="openSendDialog" data-username="${user.username}">Send</button>
        <button class="btn ${following ? "ghost" : ""}" data-action="toggleFollow" data-username="${user.username}">
          ${following ? "Following" : "Follow"}
        </button>
      </div>`;
  }).join("");

  return `<h2 class="sec" style="margin-top:4px">People to follow</h2><div class="card">${rows || '<div class="empty">No one to show yet. People will appear here as the community grows.</div>'}</div>`;
}


/* ---------- COMMUNITY (groups) ---------- */
/* Public groups show in a list. Private groups are invite-only: you join with
   a link that has a secret code in it. The creator can add and remove admins.
   Admins and the creator can lock the group and delete anyone's message.
   You can edit and delete your own messages. */

const JOIN_KEY = "hsocial.pendingJoin";
let publicGroups = [];      // public groups anyone can see
let myGroups = [];          // groups you created or joined (including private)
let openGroupId = null;     // the group you are inside, or null for the list
let openGroup = null;       // that group's live data
let messages = [];          // its messages
let editingMessageId = null;
let inputMode = null;       // what the small input popup is for
let stopPublic = null, stopMine = null, stopGroupDoc = null, stopMessages = null;

const myUid = () => auth.currentUser.uid;
const isCreator = (group) => group.creatorUid === myUid();
const isAdmin = (group) => isCreator(group) || Boolean(group.admins && group.admins[myUid()]);
const onCommunity = () => data.currentTab === "community" && screen === "app";

function startCommunity() {
  if (stopPublic) return;
  const publicQuery = query(collection(db, "groups"), where("private", "==", false), limit(100));
  stopPublic = onSnapshot(publicQuery, (snapshot) => {
    publicGroups = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    publicGroups.sort((a, b) => (b.createdAt?.toMillis() || Date.now()) - (a.createdAt?.toMillis() || Date.now()));
    refreshGroupsList();
  }, () => {});
  stopMine = onSnapshot(collection(db, "users", myUid(), "myGroups"), (snapshot) => {
    myGroups = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    refreshGroupsList();
  }, () => {});
}

function stopWatchingGroup() {
  if (stopGroupDoc) stopGroupDoc();
  if (stopMessages) stopMessages();
  stopGroupDoc = stopMessages = null;
  openGroupId = openGroup = null;
  messages = [];
}

function stopCommunity() {
  if (stopPublic) stopPublic();
  if (stopMine) stopMine();
  stopPublic = stopMine = null;
  publicGroups = myGroups = [];
  stopWatchingGroup();
}

// Start live updates for one group and its messages.
function watchGroup(groupId) {
  stopWatchingGroup();
  openGroupId = groupId;
  stopGroupDoc = onSnapshot(doc(db, "groups", groupId), (snapshot) => {
    const firstLoad = !openGroup;
    openGroup = snapshot.exists() ? { id: snapshot.id, ...snapshot.data() } : null;
    if (!openGroup) return actions.closeGroup();
    if (firstLoad) { if (onCommunity()) render(); } else refreshGroupHeader();
  }, () => { showToast("You can't open this group."); actions.closeGroup(); });

  const latest = query(collection(db, "groups", groupId, "messages"), orderBy("createdAt", "desc"), limit(100));
  stopMessages = onSnapshot(latest, (snapshot) => {
    messages = snapshot.docs.map((item) => ({ id: item.id, ...item.data() }));
    const list = $("#group-messages");   // update only the list so a half-typed message is kept
    if (list) list.innerHTML = messagesHtml();
  }, () => {});
}

function randomCode() {
  const letters = "abcdefghijkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), (n) => letters[n % 32]).join("");
}

function inviteLink(group) {
  return location.origin + location.pathname + "#group=" + group.id + (group.private ? "." + group.inviteCode : "");
}

// Join from an invite link: public groups need no code, private ones do.
async function joinGroup(groupId, code) {
  try {
    const memberRef = doc(db, "groups", groupId, "members", myUid());
    if (!(await getDoc(memberRef)).exists()) {
      await setDoc(memberRef, code ? { username: data.me.username, code } : { username: data.me.username });
    }
    const found = await getDoc(doc(db, "groups", groupId));
    if (!found.exists()) throw new Error("missing");
    await setDoc(doc(db, "users", myUid(), "myGroups", groupId), { name: found.data().name, private: found.data().private });
    data.currentTab = "community";
    watchGroup(groupId);
    render();
  } catch (error) {
    showToast("That invite link is not valid, or the group no longer exists.");
  }
}

// Remember a link opened before logging in, so it works after sign-up.
function rememberJoinLink() {
  const match = location.hash.match(/^#group=([A-Za-z0-9]+)(?:\.([a-z0-9]+))?$/);
  if (!match) return;
  try { localStorage.setItem(JOIN_KEY, JSON.stringify({ id: match[1], code: match[2] || "" })); } catch (error) {}
  history.replaceState(null, "", location.pathname);
}

async function processPendingJoin() {
  let pending = null;
  try {
    pending = JSON.parse(localStorage.getItem(JOIN_KEY));
    localStorage.removeItem(JOIN_KEY);
  } catch (error) {}
  if (pending) await joinGroup(pending.id, pending.code);
}

function groupRow(group, isMine) {
  return `
    <button class="card person" data-action="openGroup" data-id="${escapeHtml(group.id)}" style="width:100%;text-align:left;margin-bottom:10px">
      ${avatarHtml({ username: group.name, name: group.name })}
      <div class="grow">
        <div class="name">${escapeHtml(group.name)}</div>
        <div class="handle">${group.private ? "Private" : "Public"}${group.creatorName && !isMine ? " · by @" + escapeHtml(group.creatorName) : ""}</div>
      </div>
    </button>`;
}

function groupsListHtml() {
  const mine = myGroups.length ? myGroups.map((g) => groupRow(g, true)).join("") : '<div class="card empty">You have not joined any group yet.</div>';
  const open = publicGroups.length ? publicGroups.map((g) => groupRow(g, false)).join("") : '<div class="card empty">No public groups yet. Create the first one.</div>';
  return `<h3 class="sec" style="font-size:16px">Your groups</h3>${mine}<h3 class="sec" style="font-size:16px">Public groups</h3>${open}`;
}

function refreshGroupsList() {
  const list = $("#groups-list");
  if (list && onCommunity() && !openGroupId) list.innerHTML = groupsListHtml();
}

function messagesHtml() {
  if (!messages.length) return '<div class="card empty">No messages yet. Start the conversation.</div>';
  return messages.map((message) => {
    const time = message.createdAt ? message.createdAt.toMillis() : Date.now();
    const mine = message.uid === myUid();
    const buttons = (mine ? `<button class="act" data-action="editMessage" data-id="${message.id}">Edit</button>` : "")
      + (mine || isAdmin(openGroup) ? `<button class="act" data-action="deleteMessage" data-id="${message.id}">Delete</button>` : "");
    return `
      <article class="card post">
        ${avatarHtml(findUser(message.author))}
        <div class="body">
          <div><span class="name">@${escapeHtml(message.author)}</span> <span class="time">· ${timeAgo(time)}${message.editedAt ? " · edited" : ""}</span></div>
          <div class="text">${escapeHtml(message.text)}</div>
          <div class="acts">${buttons}</div>
        </div>
      </article>`;
  }).join("");
}

// Top of a group: name, admins, and the buttons you are allowed to use.
function groupHeadHtml(group) {
  const adminButtons = isCreator(group)
    ? Object.entries(group.admins || {}).map(([uid, name]) =>
        `<button class="act" data-action="removeAdmin" data-uid="${escapeHtml(uid)}">Remove admin @${escapeHtml(name)}</button>`).join("")
    : "";
  return `
    <button class="btn ghost" data-action="closeGroup">Back to groups</button>
    <h2 class="sec">${escapeHtml(group.name)}${group.locked ? " (locked)" : ""}</h2>
    <div class="hint" style="margin:-6px 2px 12px">${group.private ? "Private group" : "Public group"} · created by @${escapeHtml(group.creatorName)}</div>
    <div class="row" style="margin-bottom:8px;flex-wrap:wrap">
      <button class="btn ghost" data-action="copyInviteLink">Copy invite link</button>
      ${isAdmin(group) ? `<button class="btn ghost" data-action="toggleLock">${group.locked ? "Unlock group" : "Lock group"}</button>` : ""}
      ${isCreator(group) ? '<button class="btn ghost" data-action="openAddAdmin">Add admin</button>' : ""}
    </div>
    <div class="acts" style="margin-bottom:10px">${adminButtons}</div>`;
}

// Locks the message box when the group is locked and you are not an admin.
function refreshGroupHeader() {
  const head = $("#group-head");
  if (!openGroup || !head) return;
  head.innerHTML = groupHeadHtml(openGroup);
  const blocked = openGroup.locked && !isAdmin(openGroup);
  $("#group-text").disabled = blocked;
  $("#group-send").disabled = blocked;
  $("#group-text").placeholder = blocked ? "This group is locked. Only admins can send messages." : "Write a message";
  const list = $("#group-messages");
  if (list) list.innerHTML = messagesHtml();    // delete buttons depend on admin status
}

function communityPage() {
  if (!openGroupId) {
    return `
      <div class="bar"><h2 class="sec" style="margin:0">Community</h2>
        <button class="btn gold" data-action="openCreateGroup">Create group</button></div>
      <div id="groups-list">${groupsListHtml()}</div>`;
  }
  if (!openGroup) return '<div class="empty">Loading…</div>';
  return `
    <div id="group-head">${groupHeadHtml(openGroup)}</div>
    <div class="card compose">
      ${avatarHtml(data.me)}
      <div style="flex:1">
        <textarea id="group-text" placeholder="Write a message" aria-label="Write a message"></textarea>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="group-send" data-action="sendGroupMessage">Send</button></div>
      </div>
    </div>
    <div id="group-messages">${messagesHtml()}</div>`;
}

function openInputDialog(mode, title, label, placeholder, prefill = "") {
  inputMode = mode;
  $("#input-title").textContent = title;
  $("#input-label").textContent = label;
  $("#input-value").placeholder = placeholder;
  $("#input-value").value = prefill;
  $("#private-row").style.display = mode === "createGroup" ? "block" : "none";
  $("#input-private").checked = false;
  $("#input-error").textContent = "";
  $("#input-dialog").showModal();
  $("#input-value").focus();
}


/* ---------- ACCOUNT HELPERS ---------- */

function showAuthError(message) {
  const box = $("#auth-error");
  if (box) box.textContent = message;
}

function friendlyError(code) {
  const messages = {
    "app/username-taken": "That username is taken. Try another.",
    "auth/email-already-in-use": "An account with this email already exists. Log in instead.",
    "auth/invalid-email": "Enter a valid email.",
    "auth/weak-password": "Password must be at least 8 characters.",
    "auth/invalid-credential": "Wrong email or password.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
    "auth/network-request-failed": "No connection. Check your internet and try again.",
  };
  return messages[code] || "Something went wrong. Try again.";
}

// Decides which screen a signed-in (or signed-out) person should see.
async function routeUser(user) {
  if (!user) {
    stopCommunity();
    data.me = null;
    if (screen !== "signup") screen = "login";
    return render();
  }
  if (!user.emailVerified) {
    screen = "verify";
    return render();
  }
  const profile = await getDoc(doc(db, "users", user.uid));
  if (!profile.exists()) {
    await signOut(auth);   // account without a username: start again
    return;
  }
  const username = profile.data().username;
  data.me = { username, name: username };
  startCommunity();
  screen = "app";
  render();
  processPendingJoin();
}


/* ---------- 5. ACTIONS ---------- */
/* Each action is one thing the person can do. The buttons above name an
   action with data-action="...", and section 6 connects the two. */

const actions = {

  goToTab({ tab }) {
    data.currentTab = tab;
    saveData();
    render();
    window.scrollTo(0, 0);
  },

  showLogin()  { screen = "login";  render(); },
  showSignup() { screen = "signup"; render(); },
  showReset()  { screen = "reset";  render(); },

  // Firebase emails a link. The person opens it and sets a new password there.
  // We show the same message whether or not the email has an account, so
  // nobody can use this form to find out who is registered.
  async sendReset() {
    const email = $("#email-input").value.trim();
    if (!email.includes("@")) return showAuthError("Enter a valid email.");
    try {
      await sendPasswordResetEmail(auth, email);
    } catch (error) {
      if (error.code !== "auth/user-not-found") return showAuthError(friendlyError(error.code));
    }
    screen = "login";
    render();
    showToast("If that email has an account, a reset link is on its way.");
  },

  // Create account. Steps: check username, make the login, claim the
  // username, send the verification email.
  async signUp() {
    const email = $("#email-input").value.trim();
    const username = $("#username-input").value.trim().toLowerCase();
    const password = $("#password-input").value;

    if (!email.includes("@")) return showAuthError("Enter a valid email.");
    if (!/^[a-z0-9_]{3,16}$/.test(username)) return showAuthError("Username: 3 to 16 letters, numbers or underscores.");
    if (password.length < 8) return showAuthError("Password must be at least 8 characters.");

    isSigningUp = true;
    try {
      // Friendly early check. The database rules are the real protection.
      if ((await getDoc(doc(db, "usernames", username))).exists()) throw { code: "app/username-taken" };

      const created = await createUserWithEmailAndPassword(auth, email, password);
      try {
        // One batch: both records are saved together or not at all.
        const batch = writeBatch(db);
        batch.set(doc(db, "usernames", username), { uid: created.user.uid });
        batch.set(doc(db, "users", created.user.uid), { username, createdAt: serverTimestamp() });
        await batch.commit();
      } catch (error) {
        await deleteUser(created.user);          // someone took it first
        throw { code: "app/username-taken" };
      }
      await sendEmailVerification(created.user);
    } catch (error) {
      isSigningUp = false;
      return showAuthError(friendlyError(error.code));
    }
    isSigningUp = false;
    routeUser(auth.currentUser);
  },

  async logIn() {
    try {
      await signInWithEmailAndPassword(auth, $("#email-input").value.trim(), $("#password-input").value);
    } catch (error) {
      showAuthError(friendlyError(error.code));
    }
  },

  async checkVerified() {
    await auth.currentUser.reload();
    if (!auth.currentUser.emailVerified) return showAuthError("Not verified yet. Open the link in your email first.");
    routeUser(auth.currentUser);
  },

  async resendEmail() {
    try {
      await sendEmailVerification(auth.currentUser);
      showToast("Verification email sent");
    } catch (error) {
      showAuthError(friendlyError(error.code));
    }
  },

  async logOut() {
    await signOut(auth);
  },

  openUsernameDialog() {
    $("#new-username").value = "";
    $("#username-error").textContent = "";
    $("#username-dialog").showModal();
    $("#new-username").focus();
  },

  closeUsernameDialog() {
    $("#username-dialog").close();
  },

  // Change username: free the old one and claim the new one in a single
  // batch, so you are never left with no username or two usernames.
  async submitUsername() {
    const oldName = data.me.username;
    const newName = $("#new-username").value.trim().toLowerCase();
    const error = $("#username-error");

    if (!/^[a-z0-9_]{3,16}$/.test(newName)) return (error.textContent = "Username: 3 to 16 letters, numbers or underscores.");
    if (newName === oldName) return (error.textContent = "That is already your username.");

    try {
      if ((await getDoc(doc(db, "usernames", newName))).exists()) return (error.textContent = "That username is taken. Try another.");

      const uid = auth.currentUser.uid;
      const batch = writeBatch(db);
      batch.delete(doc(db, "usernames", oldName));
      batch.set(doc(db, "usernames", newName), { uid });
      batch.update(doc(db, "users", uid), { username: newName });
      await batch.commit();
    } catch (failure) {
      return (error.textContent = "Could not change it. It may have just been taken. Try again.");
    }

    // Keep the demo posts on this device pointing at the new name.
    data.posts.forEach((post) => { if (post.author === oldName) post.author = newName; });
    data.me = { username: newName, name: newName };
    saveData();
    $("#username-dialog").close();
    render();
    showToast("Username changed to @" + newName);
  },

  openGroup({ id }) {
    watchGroup(id);
    render();
  },

  closeGroup() {
    stopWatchingGroup();
    if (onCommunity()) render();
  },

  openCreateGroup() { openInputDialog("createGroup", "Create group", "Group name", "e.g. JUPEB study group"); },
  openAddAdmin()    { openInputDialog("addAdmin", "Add admin", "Username of the new admin", "e.g. ada"); },
  closeInputDialog() { $("#input-dialog").close(); },

  editMessage({ id }) {
    editingMessageId = id;
    const message = messages.find((m) => m.id === id);
    openInputDialog("editMessage", "Edit message", "Your message", "", message.text);
  },

  async submitInput() {
    const value = $("#input-value").value.trim();
    const error = $("#input-error");
    try {
      if (inputMode === "createGroup") {
        if (!value || value.length > 40) return (error.textContent = "Enter a group name of 1 to 40 characters.");
        const isPrivate = $("#input-private").checked;
        const groupRef = doc(collection(db, "groups"));
        const batch = writeBatch(db);
        batch.set(groupRef, {
          name: value, creatorUid: myUid(), creatorName: data.me.username, admins: {},
          locked: false, private: isPrivate, inviteCode: randomCode(), createdAt: serverTimestamp(),
        });
        batch.set(doc(db, "groups", groupRef.id, "members", myUid()), { username: data.me.username });
        batch.set(doc(db, "users", myUid(), "myGroups", groupRef.id), { name: value, private: isPrivate });
        await batch.commit();
        $("#input-dialog").close();
        actions.openGroup({ id: groupRef.id });
      } else if (inputMode === "addAdmin") {
        const username = value.toLowerCase();
        const found = await getDoc(doc(db, "usernames", username));
        if (!found.exists()) return (error.textContent = "No one has that username.");
        const uid = found.data().uid;
        if (uid === myUid()) return (error.textContent = "You made this group, so you are already an admin.");
        await updateDoc(doc(db, "groups", openGroupId), { ["admins." + uid]: username });
        $("#input-dialog").close();
        showToast("@" + username + " is now an admin");
      } else if (inputMode === "editMessage") {
        if (!value) return (error.textContent = "A message can't be empty.");
        await updateDoc(doc(db, "groups", openGroupId, "messages", editingMessageId), { text: value, editedAt: serverTimestamp() });
        $("#input-dialog").close();
      }
    } catch (failure) {
      error.textContent = "That did not work. Check your connection and try again.";
    }
  },

  // The creator can remove any admin. Other admins cannot, and the creator can never be removed.
  async removeAdmin({ uid }) {
    try {
      await updateDoc(doc(db, "groups", openGroupId), { ["admins." + uid]: deleteField() });
      showToast("Admin removed");
    } catch (failure) {
      showToast("Could not remove the admin. Try again.");
    }
  },

  async deleteMessage({ id }) {
    if (!confirm("Delete this message?")) return;
    try {
      await deleteDoc(doc(db, "groups", openGroupId, "messages", id));
    } catch (failure) {
      showToast("Could not delete the message. Try again.");
    }
  },

  async copyInviteLink() {
    const link = inviteLink(openGroup);
    try {
      await navigator.clipboard.writeText(link);
      showToast("Invite link copied");
    } catch (failure) {
      window.prompt("Copy this invite link:", link);
    }
  },

  async toggleLock() {
    try {
      await updateDoc(doc(db, "groups", openGroupId), { locked: !openGroup.locked });
      showToast(openGroup.locked ? "Group unlocked" : "Group locked");
    } catch (failure) {
      showToast("Could not change the lock. Try again.");
    }
  },

  async sendGroupMessage() {
    const box = $("#group-text");
    const text = box.value.trim();
    if (!text) return showToast("Write a message first.");
    try {
      await addDoc(collection(db, "groups", openGroupId, "messages"), {
        author: data.me.username, uid: myUid(), text, createdAt: serverTimestamp(),
      });
      box.value = "";
    } catch (failure) {
      showToast("Could not send. The group may be locked, or check your connection.");
    }
  },

  publishPost() {
    const text = $("#post-text").value.trim();
    if (!text) return showToast("Write something first.");

    data.posts.push({ id: Date.now(), author: data.me.username, text, time: Date.now(), likes: [], tipsReceived: 0 });
    saveData();
    render();
    showToast("Posted");
  },

  toggleLike({ id }) {
    const post = data.posts.find((p) => p.id === Number(id));
    const position = post.likes.indexOf(data.me.username);
    if (position === -1) post.likes.push(data.me.username);
    else post.likes.splice(position, 1);
    saveData();
    render();
  },

  toggleFollow({ username }) {
    const position = data.follows.indexOf(username);
    if (position === -1) data.follows.push(username);
    else data.follows.splice(position, 1);
    saveData();
    render();
  },

  tipPost({ id }) {
    const post = data.posts.find((p) => p.id === Number(id));
    tipTargetPostId = post.id;
    actions.openSendDialog({ username: post.author }, "Tip: your post");
  },

  openSendDialog({ username } = {}, note = "") {
    if (!data.users.length) return showToast("Sending credits to people comes with the credits server step.");
    $("#send-to").innerHTML = data.users
      .map((user) => `<option value="${escapeHtml(user.username)}">${escapeHtml(user.name)} (@${escapeHtml(user.username)})</option>`)
      .join("");
    if (username) $("#send-to").value = username;
    $("#send-amount").value = "";
    $("#send-note").value = note;
    $("#send-error").textContent = "";
    $("#send-dialog").showModal();
    $("#send-amount").focus();
  },

  submitSend() {
    const toUsername = $("#send-to").value;
    const amount = Number($("#send-amount").value);
    const note = $("#send-note").value.trim();
    const error = $("#send-error");

    if (!Number.isInteger(amount) || amount < 1) return (error.textContent = "Enter a whole number of 1 or more.");
    if (amount > data.balance) return (error.textContent = "Not enough credits. You have " + formatNumber(data.balance) + ".");

    data.balance -= amount;
    data.transactions.push({ direction: "out", otherUser: toUsername, amount, note, time: Date.now() });

    // If this send came from a Tip button, add it to that post's total.
    const tippedPost = data.posts.find((p) => p.id === tipTargetPostId);
    if (tippedPost) tippedPost.tipsReceived += amount;
    tipTargetPostId = null;

    saveData();
    $("#send-dialog").close();
    render();
    showToast(`Sent ${formatNumber(amount)} credits to @${toUsername}`);
  },

  closeSendDialog() {
    tipTargetPostId = null;
    $("#send-dialog").close();
  },

  // Placeholder. Real payment is added with the Firebase and Paystack step.
  // Credits must only ever be added by the server after Paystack confirms
  // the payment, never by this page, or anyone could give themselves credits.
  buyCredits() {
    showToast("Buying credits will work once payments are connected.");
  },
};


/* ---------- 6. START ---------- */

// One listener handles every button: find its data-action and run it.
document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = actions[button.dataset.action];
  if (action) action(button.dataset);
});

rememberJoinLink();
render();
